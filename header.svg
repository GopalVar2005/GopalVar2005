<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0" />
    </radialGradient>

    <!-- Top Border Line Gradient -->
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#58a6ff" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#bc8cff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.1" />
    </linearGradient>

    <!-- Monogram Gradient -->
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242c" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 32px; font-weight: 700; fill: #f0f6fc; letter-spacing: -0.5px; }
    .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 14px; font-weight: 400; fill: #8b949e; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #58a6ff; letter-spacing: 0.5px; }
    .pill-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #f0f6fc; }
    .pill-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
    .monogram { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-size: 20px; font-weight: 700; fill: #58a6ff; }
  </style>

  <!-- Base Card -->
  <rect width="840" height="210" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1" />
  
  <!-- Subtle Dot Grid Overlay -->
  <rect width="840" height="210" rx="14" fill="url(#dotPattern)" />

  <!-- Radial Glow Behind Name -->
  <rect width="840" height="210" rx="14" fill="url(#glow)" />

  <!-- Top Accent Line -->
  <rect x="1" y="1" width="838" height="2" fill="url(#topLine)" />

  <!-- Monogram / Logo Box -->
  <g transform="translate(36, 32)">
    <rect width="52" height="52" rx="12" fill="url(#avatarGrad)" stroke="#30363d" stroke-width="1" />
    <text x="26" y="33" text-anchor="middle" class="monogram">GV</text>
  </g>

  <!-- Opportunity Badge -->
  <g transform="translate(104, 32)">
    <rect width="226" height="22" rx="11" fill="#1c2128" stroke="#388bfd" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#3fb950" />
    <text x="24" y="15" class="badge-text">OPEN TO SDE OPPORTUNITIES</text>
  </g>

  <!-- Name & Subtitle -->
  <text x="104" y="78" class="name">Gopal Varshney</text>
  <text x="104" y="99" class="role">Full-Stack Developer • Systems &amp; Algorithms in Java • B.Tech CSE @ GLA University</text>

  <!-- Three Refined Metric Cards -->
  <!-- Card 1: LeetCode -->
  <g transform="translate(36, 134)">
    <rect width="240" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="18" y="24" class="pill-title">⚡ 950+ Problems Solved</text>
    <text x="18" y="41" class="pill-sub">LeetCode Contest Rating: 1737</text>
  </g>

  <!-- Card 2: Academic -->
  <g transform="translate(290, 134)">
    <rect width="240" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="18" y="24" class="pill-title">🎓 8.88 / 10 CGPA</text>
    <text x="18" y="41" class="pill-sub">GLA University, Mathura (2023–2027)</text>
  </g>

  <!-- Card 3: Domain -->
  <g transform="translate(544, 134)">
    <rect width="260" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="18" y="24" class="pill-title">💻 React • Java • Node.js • Express</text>
    <text x="18" y="41" class="pill-sub">Building production-grade web applications</text>
  </g>
</svg>
